name: Deploy FinPilot AI frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/refresh_public_data.py"
      - "scripts/validate_public_data.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Refresh public data snapshots
        run: python scripts/refresh_public_data.py
      - name: Validate public data snapshots
        run: python scripts/validate_public_data.py
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build website
        working-directory: frontend
        run: npm run build -- --base=/FinPilot-AI/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
