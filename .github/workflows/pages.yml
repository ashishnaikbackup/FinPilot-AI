name: Deploy FinPilot AI frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "index.html"
      - "scripts/refresh_public_data.py"
      - "scripts/feed_utils.py"
      - "scripts/validate_public_data.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Restore last-known-good public snapshots
        uses: actions/cache/restore@v4
        with:
          path: frontend/public/data
          key: finpilot-public-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            finpilot-public-data-
      - name: Refresh public data snapshots
        run: python scripts/refresh_public_data.py
      - name: Validate public data snapshots
        run: python scripts/validate_public_data.py
      - name: Write public data health summary
        run: |
          python - <<'PY'
          import json, pathlib, os
          data = pathlib.Path("frontend/public/data")
          status = json.loads((data / "status.json").read_text())
          news = json.loads((data / "news-global.json").read_text())
          lines = [
              "## FinPilot public data refresh",
              f"- Refresh attempt: {status.get('retrieved_at', 'unknown')}",
              f"- India GDP: {status.get('india_macro', {}).get('status', 'unknown')}",
              f"- Global macro: {status.get('global_macro', {}).get('status', 'unknown')} ({status.get('global_macro', {}).get('observation_count', 0)} observations)",
              f"- News: {status.get('global_news', {}).get('status', 'unknown')} ({len(news.get('articles', []))} items)",
              f"- Official-source items: {news.get('official_primary_source_count', 0)}",
              f"- GDELT discovery items: {news.get('discovery_index_count', 0)}",
              f"- Market quotes: {status.get('market_quotes', {}).get('status', 'unknown')}",
              "",
              "### Provider warnings",
          ]
          for item in status.get('global_news', {}).get('official_feed_errors', []):
              lines.append(f"- {item.get('provider')}: {item.get('error')}")
          for key in ('india_macro', 'global_macro', 'global_news'):
              error = status.get(key, {}).get('error')
              if error:
                  lines.append(f"- {key}: {error}")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write("\n".join(lines) + "\n")
          PY
      - name: Cache refreshed public snapshots
        uses: actions/cache/save@v4
        if: success()
        with:
          path: frontend/public/data
          key: finpilot-public-data-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Build website
        working-directory: frontend
        run: npm run build -- --base=/FinPilot-AI/
      - name: Smoke-test the built website
        working-directory: frontend
        run: |
          test -s dist/index.html
          grep -q 'src="/FinPilot-AI/assets/' dist/index.html
          grep -q 'href="/FinPilot-AI/assets/' dist/index.html
          find dist/assets -maxdepth 1 -type f -name '*.js' -size +0c | grep -q .
          find dist/assets -maxdepth 1 -type f -name '*.css' -size +0c | grep -q .
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
