name: FinPilot paper bot checks

on:
  pull_request:
    paths:
      - "automation/**"
      - "tests/**"
      - "docs/PAPER_TRADING.md"
      - "docs/BACKTESTING_AND_OPTIONS.md"
      - ".github/workflows/paper-bot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-bot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run all simulation and risk tests
        run: python -m unittest discover -s tests -v
