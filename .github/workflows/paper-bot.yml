name: FinPilot paper bot checks

on:
  pull_request:
    paths:
      - "automation/**"
      - "tests/test_paper_bot.py"
      - "docs/PAPER_TRADING.md"
      - ".github/workflows/paper-bot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-bot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run deterministic paper-bot tests
        run: python -m unittest tests.test_paper_bot -v
