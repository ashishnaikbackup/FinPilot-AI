name: FinPilot market data refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "35 11 * * 1-5"

permissions:
  contents: read

jobs:
  refresh-india-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Fetch permitted Upstox market data
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          MARKET_DATA_PUBLIC_DISPLAY_RIGHTS: ${{ secrets.MARKET_DATA_PUBLIC_DISPLAY_RIGHTS }}
        run: python automation/upstox_market_data.py
      - name: Upload private workflow report
        uses: actions/upload-artifact@v4
        with:
          name: finpilot-market-data-status-${{ github.run_id }}
          path: |
            frontend/public/data/market-provider-status.json
            frontend/public/data/options-chain.json
          retention-days: 7
