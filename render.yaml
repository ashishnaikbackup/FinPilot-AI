services:
  - type: web
    name: finpilot-ai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_ORIGINS
        value: https://ashishnaikbackup.github.io
      - key: SEC_USER_AGENT
        sync: false
